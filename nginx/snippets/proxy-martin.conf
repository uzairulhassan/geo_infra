# Common settings for proxying a tile request to Martin.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host martin;
proxy_connect_timeout 5s;
proxy_read_timeout    30s;

# Martin's own caching headers are replaced per server block.
proxy_hide_header Cache-Control;
proxy_hide_header Access-Control-Allow-Origin;

# Tiles are fetched cross-origin by external clients (QGIS, partner web maps).
# No cookies are honoured cross-origin, so a wildcard is safe here.
add_header Access-Control-Allow-Origin  "*" always;
add_header Access-Control-Allow-Headers "Authorization, X-Tile-Token" always;
add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
